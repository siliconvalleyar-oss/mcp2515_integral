# AUTEL Scanner - Logging Configuration

[global]
log_file = /var/log/autel_scanner.log
log_rotation = daily
max_log_size = 10MB
console_output = true
timestamp_format = %Y-%m-%d %H:%M:%S

[levels]
# Available levels: DEBUG, INFO, WARN, ERROR
hardware = INFO
can_bus = INFO
obd2 = INFO
menu = DEBUG
display = INFO

[formats]
# Log format: [timestamp] [level] [module] message
format = [{timestamp}] [{level}] [{module}] {message}

[rotation]
max_files = 7
compress_old = true
delete_old = true
